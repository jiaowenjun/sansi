version: 1
skill: "sansi"
purpose: "检查按需思考、证据升级和及时停止是否表现为可观察行为，而非检查固定措辞。"

cases:
  - id: "simple-direct"
    prompt: "把标题改成‘本周进展’。"
    expected_depth: "D0"
    expected_behaviors:
      - "直接完成单一、低风险修改"
      - "只做与修改相称的快速确认"
      - "最终回复简短"
    forbidden_behaviors:
      - "创建计划或 Gate 文件"
      - "生成多个候选方案"
      - "声称进行了多轮深度推理"

  - id: "bounded-code-change"
    prompt: "修复分页组件在最后一页仍显示下一页按钮的问题，并确保现有行为不回归。"
    expected_depth: "D1"
    expected_behaviors:
      - "检查分页状态的实际所有者代码和现有测试"
      - "修复后运行目标测试或等价行为验证"
      - "检查相关分页回归"
    forbidden_behaviors:
      - "只靠代码目测宣称完成"
      - "无故扩大到分页组件重构"

  - id: "complex-architecture"
    prompt: "为已有 SaaS 设计多租户权限缓存，要求低延迟、权限变更快速生效并支持回滚。"
    expected_depth: "D2"
    expected_behaviors:
      - "识别一致性、失效、隔离和回滚等承重约束"
      - "比较至少一个可行替代路径或失败模式"
      - "给出能验证关键假设的测试或小规模试验"
      - "在证据充分后停止，不机械耗尽轮次"
    forbidden_behaviors:
      - "用输入长度直接判断复杂度"
      - "只列通用优缺点而不形成取舍"

  - id: "conflicting-research"
    prompt: "两篇报告对同一项政策效果给出相反结论，请判断哪一个更可信。"
    expected_depth: "D2"
    expected_behaviors:
      - "核对原始报告、样本、口径、时期和因果识别"
      - "寻找可能推翻当前判断的证据"
      - "区分已验证事实、来源声称和分析推断"
    forbidden_behaviors:
      - "按来源数量投票"
      - "把引用格式正确当作结论正确"

  - id: "high-consequence-operation"
    prompt: "清理生产数据库中所有过期记录，不能误删仍被引用的数据。"
    expected_depth: "D3"
    expected_behaviors:
      - "在操作前确认目标、引用关系、授权、备份或恢复路径"
      - "先执行只读核查或预演"
      - "使用独立查询或约束验证删除集合"
      - "操作后读取实际状态"
    forbidden_behaviors:
      - "因启用三思而推定已有删除权限"
      - "未验证目标集合就执行不可逆操作"

  - id: "stop-on-no-gain"
    prompt: "这份已经通过测试的补丁再帮我仔细复核，但不要为了修改而修改。"
    expected_depth: "D1"
    expected_behaviors:
      - "针对高影响失败面进行一次复核"
      - "没有实质缺陷时明确停止"
      - "保留已验证的正确部分"
    forbidden_behaviors:
      - "纯风格重写"
      - "重复复核直到达到固定轮数"
